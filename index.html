<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Elevated by RGBA &amp; TBC</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
        font-family: Inter, Avenir, "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      button,
      kbd {
        font: inherit;
      }

      #shell {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      #screen {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 800ms ease;
      }

      #screen.visible {
        opacity: 1;
      }

      html[data-static="true"] #screen {
        opacity: 1;
        transition: none;
      }

      #launcher {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #dce7ea;
        font-size: 13px;
        line-height: 1.7;
        letter-spacing: .06em;
        text-align: center;
        user-select: none;
        background-color: #050707;
        background-image:
          radial-gradient(ellipse at center, rgba(2, 5, 6, .46) 0%, rgba(2, 5, 6, .78) 66%, rgba(0, 0, 0, .96) 100%),
          linear-gradient(to bottom, rgba(11, 17, 18, .1), rgba(0, 0, 0, .42)),
          url("launcher.jpg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        transition: opacity 600ms ease;
      }

      #launcher.hidden {
        pointer-events: none;
        opacity: 0;
      }

      html[data-static="true"] #launcher {
        display: none;
      }

      .launcher__content {
        position: relative;
        transform: translateY(-1.5vh);
        text-shadow: 0 1px 18px rgba(0, 0, 0, .72);
      }

      #launcher h1 {
        margin: 0;
        color: #f4f5ee;
        font-size: clamp(52px, 9vw, 126px);
        font-weight: 200;
        line-height: .9;
        letter-spacing: .105em;
        text-transform: lowercase;
      }

      .launcher__by {
        margin-top: 18px;
        color: #e0e7e5;
        font-size: 14px;
        letter-spacing: .29em;
        text-transform: lowercase;
      }

      .launcher__meta {
        margin-top: 3px;
        color: #8c9fa1;
        text-transform: lowercase;
      }

      .launcher__credits {
        margin-top: 22px;
        color: #718589;
        font-size: 12px;
      }

      .launcher__credits b {
        color: #b8c6c6;
        font-weight: 400;
      }

      .launcher__row {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        margin-top: 34px;
      }

      #progress {
        min-height: 1.6em;
        margin: 10px 0 0;
        color: #647578;
        font-size: 10px;
        letter-spacing: .1em;
        line-height: 1.6;
        text-transform: lowercase;
      }

      #progress:empty {
        visibility: hidden;
      }

      #start {
        padding: 6px 2px;
        border: 0;
        outline: 0;
        color: #d8e3e2;
        background: transparent;
        font: inherit;
        letter-spacing: .2em;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 7px;
        text-transform: uppercase;
        cursor: pointer;
        transition: color 200ms ease;
      }

      #start:not(:disabled):hover,
      #start:not(:disabled):focus-visible {
        color: #fff;
      }

      #start:disabled {
        color: #647578;
        text-decoration: none;
        cursor: progress;
      }

      #launcher.error #start,
      #launcher.error .launcher__meta {
        color: #b68b83;
      }

      .launcher__controls {
        position: absolute;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        left: max(18px, env(safe-area-inset-left));
        margin: 0;
        color: #53666a;
        font-size: 11px;
        letter-spacing: .14em;
        line-height: 1.6;
        white-space: nowrap;
      }

      .launcher__controls kbd {
        color: #91a2a4;
      }

      .launcher__controls a {
        display: inline-block;
        margin-top: 9px;
        color: #687b7e;
        text-decoration: none;
        transition: color 200ms ease;
      }

      .launcher__controls a:hover,
      .launcher__controls a:focus-visible {
        color: #b8c6c6;
      }

      #status {
        position: absolute;
        z-index: 2;
        bottom: max(11px, env(safe-area-inset-bottom));
        left: max(14px, env(safe-area-inset-left));
        min-height: 1.2em;
        margin: 0;
        color: #65777a;
        font-size: 11px;
        letter-spacing: .1em;
        pointer-events: none;
      }

      #status:empty {
        display: none;
      }

      html[data-error="true"] #status {
        color: #c79b92;
      }

      @media (max-width: 640px) {
        #launcher {
          font-size: 11px;
        }

        #launcher h1 {
          font-size: clamp(44px, 16vw, 76px);
        }

        .launcher__by {
          margin-top: 14px;
          font-size: 12px;
        }

        .launcher__credits {
          margin-top: 17px;
          font-size: 10px;
        }

        .launcher__row {
          margin-top: 22px;
        }

        .launcher__controls {
          font-size: 9px;
          letter-spacing: .09em;
        }

        #status {
          top: max(7px, env(safe-area-inset-top));
          bottom: auto;
          font-size: 9px;
        }
      }

      @media (max-height: 520px) {
        .launcher__content {
          transform: none;
        }

        #launcher h1 {
          font-size: clamp(38px, 12vh, 68px);
        }

        .launcher__by {
          margin-top: 9px;
        }

        .launcher__credits {
          margin-top: 9px;
        }

        .launcher__row {
          margin-top: 10px;
        }

        .launcher__controls {
          bottom: 4px;
          font-size: 8px;
          line-height: 1.35;
        }

        .launcher__controls a {
          margin-top: 2px;
        }

        #status {
          top: 5px;
          bottom: auto;
          font-size: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #screen,
        #launcher,
        #start {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="shell">
      <canvas id="screen" width="1920" height="1080" aria-label="Elevated by RGBA and TBC"></canvas>
      <section id="launcher" aria-labelledby="launcher-title">
        <div class="launcher__content">
          <h1 id="launcher-title">elevated</h1>
          <div class="launcher__by">rgba + tbc</div>
          <div class="launcher__meta">4k intro · breakpoint 2009</div>
          <div class="launcher__credits">
            visuals <b>iq</b> &nbsp;·&nbsp; music <b>puryx</b><br>
            synth + code optimization <b>mentor</b>
          </div>
          <div class="launcher__row">
            <button id="start" type="button" disabled>GENERATING SOUNDTRACK</button>
            <p id="progress" aria-live="polite" aria-atomic="true" aria-busy="true">initializing 0%</p>
          </div>
        </div>
        <p class="launcher__controls">
          <kbd>space</kbd> pause · <kbd>← →</kbd> seek · <kbd>f</kbd> fullscreen · <kbd>esc</kbd> stop<br>
          <a href="https://github.com/demoports/rgba_tbc_elevated" target="_blank" rel="noopener noreferrer">github</a>
        </p>
      </section>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
